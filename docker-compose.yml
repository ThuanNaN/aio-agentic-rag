services:

  # ── Nginx load balancer for vLLM embedding servers
  embedding-lb:
    image: nginx:alpine
    container_name: embedding_lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/embedding.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped


  # ── Chroma vector store
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma_db
    ports:
      - "8000:8000" 
    volumes:
      - ./data/chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


  # ── Chroma Admin UI 
  chroma-admin:
    image: fengzhichao/chromadb-admin:latest
    container_name: chroma_admin
    ports:
      - "3001:3001"
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped


