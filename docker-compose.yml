services:

  # ── Nginx load balancer for vLLM embedding servers
  embedding-lb:
    image: nginx:alpine
    container_name: embedding_lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/embedding.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped


  # ── Chroma vector store
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma_db
    ports:
      - "8000:8000" 
    volumes:
      - ./data/chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s


  # ── Chroma Admin UI 
  chroma-admin:
    image: fengzhichao/chromadb-admin:latest
    container_name: chroma_admin
    ports:
      - "3001:3001"
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped


  # ── Gradio UI
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: rag_ui
    ports:
      - "7860:7860"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped


  # ── FastAPI service
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: rag_api
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - EMBEDDING_BASE_URL=http://embedding-lb/v1
    volumes:
      - ./data:/app/data         # indexes built by ingest script
      - ./results:/app/results   # benchmark CSV output
    depends_on:
      chroma:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
