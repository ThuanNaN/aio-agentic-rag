upstream embedding_backends {
    least_conn;

    # Add / remove machines here. Each runs:
    #   vllm serve google/embeddinggemma-300m --port 8080
    server 100.66.71.90:8080;
    server 100.70.254.128:8080;
}

server {
    listen 80;
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass         http://embedding_backends;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Embedding requests can be slow on large batches
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
