upstream embedding_backends {
    least_conn;
    keepalive 64;

    # Add / remove machines here. Each runs:
    #   vllm serve google/embeddinggemma-300m --port 8081
    #   vllm serve google/embeddinggemma-300m --port 8082
    #   vllm serve google/embeddinggemma-300m --port 8083

    server 100.102.138.25:8081;
    server 100.102.138.25:8082;
    server 100.102.138.25:8083;
}

server {
    listen 80;
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass         http://embedding_backends;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Embedding requests can be slow on large batches
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        client_max_body_size 50m;
    }
}
