dataset:
  name: "th1nhng0/vietnamese-legal-documents"
  configs:
    metadata: "metadata"
    content: "content"
    relationships: "relationships"
  sample_size: null  # null = full dataset; set int (e.g. 1000) for quick smoke tests

paths:
  data_raw: "./data/raw"
  data_processed: "./data/processed"
  data_eval: "./data/eval"
  bm25_index: "./data/processed/bm25.pkl"
  graph_index: "./data/processed/graph.pkl"
  results: "./results"

chunking:
  chunk_size: 1000
  chunk_overlap: 200
  clean_workers: 8
  # Vietnamese legal markers used for article-aware splitting
  separators:
    - "\nĐiều "
    - "\nKhoản "
    - "\nĐiểm "
    - "\n\n"
    - "\n"
    - " "

embeddings:
  model: "google/embeddinggemma-300m"
  base_url: "http://localhost:8080/v1"
  api_key: "empty"
  batch_size: 512
  embed_workers: 8

chroma:
  collection_name: "vn_legal_docs"
  distance_metric: "cosine"
  host: "localhost"
  port: 8000
  upsert_bs: 512

retrieval:
  k: 5          # default top-k for dense retrieval
  bm25_k: 10    # candidates from BM25 before RRF
  dense_k: 10   # candidates from dense before RRF
  rrf_k: 60     # RRF constant
  reranker_model: "BAAI/bge-reranker-v2-m3"
  graph_max_hops: 2
  graph_edge_types:
    - "amended_by"
    - "references"
    - "replaces"

generation:
  provider: "openai"
  model: "gpt-4.1"
  temperature: 0.0
  max_tokens: 2048

evaluation:
  gold_set_path: "./data/eval/gold_set.json"
  recall_k: 5
  ndcg_k: 10
  query_types:
    - "factual"
    - "multi_hop"
    - "temporal"
    - "reasoning"
