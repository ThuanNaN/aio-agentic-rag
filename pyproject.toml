[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-agentic-rag"
version = "0.1.0"
description = "Benchmarking Agentic RAG on Vietnamese Legal Documents"
requires-python = ">=3.11"
dependencies = [
    # Deep Agents + LangChain / LangGraph
    "deepagents>=0.6.1",
    "langchain>=1.3.0",
    "langchain-openai>=1.2.1",
    "langchain-community>=0.4.1",
    "langchain-chroma>=1.1.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint>=4.1.0",

    # Embeddings (local, multilingual)
    "sentence-transformers>=5.5.0",

    # Vector store
    "chromadb>=1.5.9",

    # BM25
    "rank-bm25>=0.2.2",

    # Reranker
    "transformers>=5.8.1",
    "torch>=2.10.0",

    # Graph
    "networkx>=3.3",

    # Dataset loading
    "datasets>=4.8.5",
    "huggingface-hub>=1.15.0",

    # HTML cleaning
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",

    # Evaluation
    "ragas>=0.4.3",
    "numpy>=1.26.0",
    "scikit-learn>=1.8.0",

    # FastAPI
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "pydantic>=2.7.0",

    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]
ollama = [
    "langchain-ollama>=1.0.0",
]
gemini = [
    "langchain-google-genai>=4.0.0",
]
all-providers = [
    "langchain-ollama>=1.0.0",
    "langchain-google-genai>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
